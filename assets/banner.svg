<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-label="CAPE ERC — CAPE Economic Research and Consulting">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="55%" stop-color="#123A6B"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2C14E"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- faint continental grid motif -->
  <g stroke="#8FA8D6" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="55" x2="1200" y2="55"/>
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="165" x2="1200" y2="165"/>
    <line x1="150" y1="0" x2="150" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="750" y1="0" x2="750" y2="220"/>
    <line x1="1050" y1="0" x2="1050" y2="220"/>
  </g>

  <!-- monogram mark -->
  <g transform="translate(60,45)">
    <rect x="0" y="0" width="130" height="130" rx="18" fill="#0F2E57" stroke="url(#gold)" stroke-width="3"/>
    <text x="65" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="url(#gold)" text-anchor="middle">C</text>
    <polyline points="24,104 45,80 62,92 88,58 106,70" fill="none" stroke="#F2C14E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="106" cy="70" r="4.5" fill="#F2C14E"/>
  </g>

  <!-- wordmark -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="220" y="108" font-size="58" font-weight="700" fill="#FFFFFF">CAPE <tspan fill="url(#gold)">ERC</tspan></text>
    <text x="222" y="140" font-size="21" font-weight="500" fill="#C9D6EC" letter-spacing="0.5">CAPE Economic Research and Consulting</text>
    <text x="222" y="168" font-size="16" fill="#8FA8D6" letter-spacing="0.3">Applied macro-finance &amp; text-as-data research on African economies</text>
  </g>
</svg>
